# sys-airplay Einstellungen
# Name, unter dem die Switch auf dem iPhone erscheint
name=Switch
# Lautstaerke auf der Switch (0.0 - 1.0)
volume=1.00
# Puffer in Millisekunden. Bei Aussetzern im WLAN erhoehen (z.B. 600).
buffer_ms=350
# Protokoll nach sdmc:/config/sys-airplay/log.txt (1 = an, 0 = aus)
log=1
