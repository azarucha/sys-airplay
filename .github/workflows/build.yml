name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends python3 zip ca-certificates
          # pkg.devkitpro.org blocks CI downloads; the image already ships the portlibs
          test -f "$DEVKITPRO/portlibs/switch/lib/libmbedcrypto.a" || { echo "switch-mbedtls missing in image"; exit 1; }

      - name: Fetch ALAC decoder, libtesla and AirPlay key
        run: python3 fetch_deps.py

      - name: Build
        run: make

      - name: Package SD card layout
        run: cd out && zip -r ../sys-airplay.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: sys-airplay
          path: out/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sys-airplay.zip
          generate_release_notes: true
